name: Build

# Only changes to code, build files, the hrtc schema or the manifest the
# tests read start a build; documentation and other files do not.
on:
  push:
    paths:
      - "include/**"
      - "source/**"
      - "tools/**"
      - "examples/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "**/CMakeLists.txt"
      - "fbs/**"
      - "assets/template/hrtc_template.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "include/**"
      - "source/**"
      - "tools/**"
      - "examples/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "**/CMakeLists.txt"
      - "fbs/**"
      - "assets/template/hrtc_template.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ORT_VERSION: 1.31.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ort: linux-x64
          - os: macos-latest
            ort: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and OpenCV
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang ninja-build libopencv-dev
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            brew install ninja opencv
          fi

      - name: Download ONNX Runtime
        run: |
          name="onnxruntime-${{ matrix.ort }}-${ORT_VERSION}"
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${name}.tgz" | tar xz
          echo "ORT_ROOT=$PWD/${name}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DORT_ROOT="$ORT_ROOT"

      - name: Build
        run: cmake --build build/debug --parallel

      - name: Test
        run: ctest --test-dir build/debug --output-on-failure --parallel 4

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download OpenCV and ONNX Runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external | Out-Null
          Invoke-WebRequest https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-windows.exe -OutFile external/opencv.exe
          $process = Start-Process external/opencv.exe -ArgumentList '-y', "-o$PWD/external" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'OpenCV extraction failed' }
          $name = "onnxruntime-win-x64-$env:ORT_VERSION"
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$name.zip" -OutFile external/ort.zip
          Expand-Archive external/ort.zip external
          "ORT_ROOT=$PWD/external/$name" >> $env:GITHUB_ENV
          "OpenCV_DIR=$PWD/external/opencv/build/x64/vc16/lib" >> $env:GITHUB_ENV
          "$PWD/external/$name/lib" >> $env:GITHUB_PATH
          "$PWD/external/opencv/build/x64/vc16/bin" >> $env:GITHUB_PATH

      - name: Build MNN and ncnn CPU SDKs
        run: |
          Invoke-WebRequest https://github.com/alibaba/MNN/archive/refs/tags/3.0.0.zip -OutFile external/mnn.zip
          Expand-Archive external/mnn.zip external
          cmake -S external/MNN-3.0.0 -B build/mnn -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$PWD/external/mnn" -DMNN_BUILD_SHARED_LIBS=ON -DMNN_SEP_BUILD=OFF -DMNN_BUILD_TOOLS=OFF -DMNN_BUILD_CONVERTER=OFF -DMNN_METAL=OFF -DMNN_OPENCL=OFF -DMNN_VULKAN=OFF
          if ($LASTEXITCODE -ne 0) { throw 'MNN configuration failed' }
          cmake --build build/mnn --target MNN --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'MNN build failed' }
          cmake --install build/mnn
          if ($LASTEXITCODE -ne 0) { throw 'MNN installation failed' }
          New-Item -ItemType Directory -Force external/mnn/bin | Out-Null
          Copy-Item build/mnn/MNN.dll external/mnn/bin/
          "MNN_ROOT=$PWD/external/mnn" >> $env:GITHUB_ENV
          Invoke-WebRequest https://github.com/Tencent/ncnn/archive/refs/tags/20260526.zip -OutFile external/ncnn.zip
          Expand-Archive external/ncnn.zip external
          cmake -S external/ncnn-20260526 -B build/ncnn -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$PWD/external/ncnn" -DNCNN_VERSION=20260526 -DNCNN_VULKAN=OFF -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF -DNCNN_BUILD_TESTS=OFF -DNCNN_OPENMP=OFF -DNCNN_SHARED_LIB=OFF -DNCNN_RUNTIME_CPU=OFF -DNCNN_AVX=OFF -DNCNN_AVX2=OFF -DNCNN_AVX512=OFF
          if ($LASTEXITCODE -ne 0) { throw 'ncnn configuration failed' }
          cmake --build build/ncnn --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'ncnn build failed' }
          cmake --install build/ncnn
          if ($LASTEXITCODE -ne 0) { throw 'ncnn installation failed' }
          "ncnn_ROOT=$PWD/external/ncnn" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build/debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DORT_ROOT="$env:ORT_ROOT" -DOpenCV_DIR="$env:OpenCV_DIR" -DMNN_ROOT="$env:MNN_ROOT" -Dncnn_ROOT="$env:ncnn_ROOT"

      - name: Build
        run: cmake --build build/debug --parallel 4

      - name: Test
        run: ctest --test-dir build/debug --output-on-failure --parallel 4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ultralytics ONNX exporter
        run: |
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch installation failed' }
          python -m pip install ultralytics==8.1.4 onnx==1.14.1 numpy==1.26.4 opencv-python==4.10.0.84

      - name: Download official model and export ONNX
        run: |
          python -c "from ultralytics import YOLO; YOLO('external/yolov8n.pt').export(format='onnx', imgsz=(480,640), opset=17, simplify=False, dynamic=False)"
          if ($LASTEXITCODE -ne 0) { throw 'ONNX export failed' }
          python -c "import json; from pathlib import Path; m=json.loads(Path('assets/yolo/yolo.json').read_text()); m['algos']=m['algos'][:1]; m['algos'][0]['config']['engine']['backends'][0]['data']='external/yolov8n.onnx'; Path('build/yolo.json').write_text(json.dumps(m))"

      - name: Test ONNX model CLI workflow
        run: |
          build/tools/hrt-compress.exe -j build/yolo.json -o build/yolo.hrtc
          if ($LASTEXITCODE -ne 0) { throw 'Model packaging failed' }
          build/tools/hrt-model-bench.exe -m build/yolo.hrtc -n detect -e ort -i 3 -w 1
          if ($LASTEXITCODE -ne 0) { throw 'ONNX inference failed' }
          build/tools/hrt-validate.exe -m build/yolo.hrtc -n detect -e ort -i assets/yolo/images -o build/detect.json -r build/drawn
          if ($LASTEXITCODE -ne 0) { throw 'Image validation failed' }
          python -c "import json; from pathlib import Path; r=json.loads(Path('build/detect.json').read_text()); bus=next(i for i in r['images'] if i['file'].endswith('bus.jpg')); assert all(i['error'] is None for i in r['images']); assert bus['results']; assert Path('build/drawn/bus.jpg').is_file()"
